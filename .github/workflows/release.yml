name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML for the frontmatter cross-check
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate
        run: |
          python scripts/validate_skills.py
          python -m unittest discover -s tests
      - name: Check that the tag matches the plugin version
        run: |
          version="$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the plugin version ${version}"
            exit 1
          fi
      - name: Package the skills
        run: |
          mkdir -p dist
          zip -r "dist/shieldlabs-skills-${GITHUB_REF_NAME}.zip" skills -x "*/__pycache__/*"
      - name: Release notes from the changelog
        run: |
          python - <<'EOF' > dist/notes.md
          import os
          import re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|^\[)", text, re.S | re.M)
          print(match.group(1).strip() if match else "")
          EOF
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Safe to re-run for the same tag: an existing release gets the archive and notes again.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file dist/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --notes-file dist/notes.md
          fi
